name = "backend"
main = "build/index.js"
compatibility_date = "2026-09-29"

[build]
command = "worker-build --release --locked"

# Plain-text vars (non-secret). ENVIRONMENT tells the running Worker which
# backend it is: "dev" locally, "production" after deploy.
[vars]
ENVIRONMENT = "dev"

# Default (no --env flag): local dev. `wrangler dev` resolves the binding
# below to a Miniflare-backed local D1 (plain SQLite files under
# .wrangler/state/), so the remote D1 instance is never touched.
[[d1_databases]]
binding = "dashboard"
database_name = "dashboard"
database_id = "9f4dde3a-c017-4f06-89ac-15a6b9ea1b9b"

# One PairingObject instance per pairing session (idFromName(session_id)).
# One DeviceObject instance per active device token (idFromName(device_token)).
[durable_objects]
bindings = [
  { name = "PAIRING_OBJECT", class_name = "PairingObject" },
  { name = "DEVICE_OBJECT", class_name = "DeviceObject" },
  { name = "DEVICES_HUB", class_name = "DevicesHubObject" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DeviceObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DevicesHubObject"]

# Production bindings must be declared explicitly: environments do not inherit them.
[env.production]
name = "backend-production"
account_id = "eb7edc81b33d5f40d1f026bfd37f3a49"
workers_dev = false
preview_urls = false
routes = [{ pattern = "dashboard-api.solvepao.com", custom_domain = true }]

# CI builds and validates this bundle before the deployment job uploads it.
[env.production.build]
command = ""

[env.production.observability]
enabled = true
head_sampling_rate = 1

[[env.production.d1_databases]]
binding = "dashboard"
database_name = "dashboard"
database_id = "9f4dde3a-c017-4f06-89ac-15a6b9ea1b9b"
migrations_dir = "migrations"

[env.production.durable_objects]
bindings = [
  { name = "PAIRING_OBJECT", class_name = "PairingObject" },
  { name = "DEVICE_OBJECT", class_name = "DeviceObject" },
  { name = "DEVICES_HUB", class_name = "DevicesHubObject" },
]

[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_ORIGINS = "https://homehub.solvepao.com,https://nest.solvepao.com"
