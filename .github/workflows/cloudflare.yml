name: Cloudflare production

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  VITE_API_URL: https://dashboard-api.solvepao.com
  VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir mobile install --frozen-lockfile
          cargo install worker-build --version 0.8.7 --locked
      - name: Require production Google client configuration
        if: github.event_name != 'pull_request'
        run: test -n "$VITE_GOOGLE_CLIENT_ID"
      - name: Build applications
        run: |
          pnpm build:frontend
          pnpm build:mobile
          pnpm build:api
      - name: Validate deployment bundles
        run: |
          pnpm validate:api
          pnpm validate:frontend
          pnpm validate:mobile
      - uses: actions/upload-artifact@v4
        with:
          name: production-bundles
          if-no-files-found: error
          path: |
            backend/build
            frontend/dist
            mobile/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: production-bundles
          path: .
      - name: Reject a superseded release before changing production
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$GITHUB_SHA" = "$latest"
      - name: Apply production database migrations
        run: pnpm db:migrate:production
      - name: Deploy API
        run: pnpm deploy:api
      - name: Verify API before publishing clients
        run: pnpm verify:production --api-only
      - name: Deploy frontend
        run: pnpm deploy:frontend
      - name: Deploy mobile
        run: pnpm deploy:mobile
      - name: Verify production applications
        run: pnpm verify:production
      - name: Record deployed versions
        run: |
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          for config in backend frontend mobile; do
            echo "### $config" >> "$GITHUB_STEP_SUMMARY"
            if [ "$config" = backend ]; then
              pnpm exec wrangler deployments list --config "$config/wrangler.toml" --env production >> "$GITHUB_STEP_SUMMARY"
            else
              pnpm exec wrangler deployments list --config "$config/wrangler.toml" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo 'Verified: https://dashboard-api.solvepao.com, https://homehub.solvepao.com, https://nest.solvepao.com' >> "$GITHUB_STEP_SUMMARY"
